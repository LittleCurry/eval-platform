# 前端静态服务 + API 反向代理(M7-4)。
#
# 为什么用 nginx 同源代理而不是让前端直连 api 域名: 同源就不需要 CORS、不需要在
# 前端打包时写死后端地址(`VITE_API_BASE` 默认就是 /api/v1), 而且部署只有一个入口。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 带指纹的构建产物可以长缓存(文件名变了才会重新下载)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA 必须回落到 index.html: 否则刷新 /runs/155 这种前端路由会 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 报告聚合与提交在慢查询下可能超过默认 60s
        proxy_read_timeout 300s;
    }

    location = /healthz {
        proxy_pass http://api:8080/healthz;
    }
}
