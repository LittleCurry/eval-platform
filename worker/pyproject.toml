[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eval-worker"
version = "0.1.0"
description = "评测平台 Python worker: 评测执行/检索/judge/指标(骨架阶段)"
requires-python = ">=3.11"
dependencies = [
    "structlog>=24.1",
    "pydantic-settings>=2.2",
    "psycopg[binary]>=3.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"